services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minurl
    restart: unless-stopped

  minurl:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: minurl:latest
    expose:
      - "8888"
    environment:
      MINURL_STORAGE_DSN: "postgres://minurl:minurl@postgres:5432/minurl?sslmode=disable"
      MINURL_LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minurl
      POSTGRES_PASSWORD: minurl
      POSTGRES_DB: minurl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minurl -d minurl"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
