services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minurl
    restart: unless-stopped

  minurl:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: minurl:latest
    expose:
      - "8888"
    environment:
      MINURL_STORAGE_DSN: "sqlite3:///data/minurl.sqlite3"
      MINURL_LOG_FORMAT: "json"
    volumes:
      - minurl_data:/data
    restart: unless-stopped

volumes:
  minurl_data:
