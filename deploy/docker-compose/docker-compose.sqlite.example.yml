# Docker Compose example for running minurl with SQLite
#
# USAGE: Copy this file to docker-compose.sqlite.yml before running:
#   cp docker-compose.sqlite.example.yml docker-compose.sqlite.yml
#   docker-compose -f docker-compose.sqlite.yml up

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      minurl:
        condition: service_healthy
    restart: unless-stopped

  minurl:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: minurl:latest
    expose:
      - "8888"
    environment:
      MINURL_STORAGE_DSN: "${MINURL_STORAGE_DSN:-sqlite3:///data/minurl.sqlite3}"
      MINURL_LOG_FORMAT: "json"
    volumes:
      - minurl_data:/data
    healthcheck:
      test: ["CMD", "/minurl", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  minurl_data:
