# Kubernetes example for running minurl with PostgreSQL
#
# USAGE:
#   # Build and push the image first:
#   docker build -t <your-registry>/minurl:latest ../../
#   docker push <your-registry>/minurl:latest
#
#   # Create the Secret with your real credentials (do NOT commit plaintext secrets):
#   kubectl create secret generic minurl-postgres \
#     --from-literal=dsn='postgres://minurl:password@postgres:5432/minurl?sslmode=require'
#
#   # Copy this file and update the image field, then apply:
#   cp minurl-postgres.example.yaml minurl-postgres.yaml
#   # Edit minurl-postgres.yaml: replace 'minurl:latest' with your registry image
#   kubectl apply -f minurl-postgres.yaml
#
# NOTE: This manifest does NOT include a PostgreSQL deployment.
#       Use a managed database service or a separate Postgres StatefulSet.

---
# Secret — holds the PostgreSQL DSN.
# Replace the placeholder value with your Base64-encoded DSN, or use
# `kubectl create secret` as shown in USAGE above.
apiVersion: v1
kind: Secret
metadata:
  name: minurl-postgres
type: Opaque
stringData:
  # For LOCAL DEV only (sslmode=disable is acceptable locally):
  #   postgres://minurl:password@postgres:5432/minurl?sslmode=disable
  #
  # For PRODUCTION (always use encrypted connections):
  #   postgres://minurl:password@postgres:5432/minurl?sslmode=require
  #   or
  #   postgres://minurl:password@postgres:5432/minurl?sslmode=verify-full
  dsn: "postgres://minurl:password@postgres:5432/minurl?sslmode=require"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minurl
  labels:
    app: minurl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minurl
  template:
    metadata:
      labels:
        app: minurl
    spec:
      containers:
        - name: minurl
          # Replace with your registry image, e.g. ghcr.io/your-org/minurl:latest
          image: minurl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            - name: MINURL_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  name: minurl-postgres
                  key: dsn
            - name: MINURL_LOG_FORMAT
              value: "json"

          # startupProbe — gates liveness/readiness until the app (and its DB
          # connection) is ready. Allows up to 60 s (12 × 5 s) because PostgreSQL
          # connectivity may take longer than SQLite.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          # livenessProbe — restarts the container if it becomes unresponsive.
          # Checks /livez (no DB required) to avoid cascading restarts on DB issues.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # readinessProbe — removes the pod from Service endpoints when the DB
          # is unreachable, preventing traffic to an unhealthy instance.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# Service — exposes minurl within the cluster
apiVersion: v1
kind: Service
metadata:
  name: minurl
  labels:
    app: minurl
spec:
  selector:
    app: minurl
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
  type: ClusterIP
