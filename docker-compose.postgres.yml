services:
  minurl:
    image: minurl:latest
    build:
      context: .
    restart: unless-stopped
    environment:
      # sslmode=disable is safe on an internal Docker network; use sslmode=require or verify-full in production.
      MINURL_STORAGE_DSN: postgres://postgres:${POSTGRES_PASSWORD:-minurl}@postgres:5432/minurl?sslmode=disable
    expose:
      - "8888"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minurl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minurl}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minurl"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minurl

volumes:
  postgres-data:
