# MinURL configuration example
# Usage:
#   go run ./cmd/minurl --config config.example.yaml

# HTTP listen address.
# Default: ":8888"
http-addr: ":8888"

# Storage DSN.
# For SQLite: use the sqlite3:// scheme.
#   sqlite3://minurl.sqlite3              (relative path)
#   sqlite3://var/data/minurl.sqlite3     (relative subdirectory)
#   sqlite3:///absolute/path/minurl.db    (absolute path, three slashes)
#   sqlite3://minurl.sqlite3?cache=shared (with options)
# For PostgreSQL: use a postgres:// DSN.
#   DEVELOPMENT / local testing (unencrypted, acceptable only on loopback):
#     postgres://user:password@localhost:5432/minurl?sslmode=disable
#   PRODUCTION — always use encrypted connections:
#     postgres://user:password@db.example.com:5432/minurl?sslmode=require
#     postgres://user:password@db.example.com:5432/minurl?sslmode=verify-full
#
# PostgreSQL sslmode reference:
#   disable     — no SSL/TLS. NEVER use in production.
#   allow       — tries plain, falls back to SSL.
#   prefer      — tries SSL, falls back to plain.
#   require     — SSL required, server certificate NOT verified. Protects against
#                 passive eavesdropping only; does not prevent MITM attacks.
#   verify-ca   — SSL required, CA signature verified. Acceptable for internal
#                 networks with a private CA.
#   verify-full — SSL required, CA + hostname verified. Recommended for production.
#
# The backend is auto-detected from the DSN scheme.
# Default: "sqlite3://minurl.sqlite3"
storage-dsn: "sqlite3://minurl.sqlite3"

# Log output format.
# Accepted values: "text", "json"
# Default: "text"
log-format: "text"

# OpenTelemetry tracing settings.
# Set otel-enabled to true to enable tracing.
# Supported exporters: "stdout", "otlp"
# Default: stdout
otel-enabled: false
otel-service-name: "minurl"
otel-exporter: "stdout"
otel-endpoint: ""
otel-insecure: true

# Optional deterministic seed for ID generation.
# Accepted formats:
# - decimal: "12345"
# - hex: "0x3039"
# Leave empty to use the built-in default seed.
id-seed: ""

# Database connection pool settings.
# These settings apply to the PostgreSQL backend only.
# SQLite always uses a single connection regardless of these settings.
#
# Recommended values for a typical production PostgreSQL deployment:
#   db-max-open-conns: 25   (increase for high-concurrency workloads)
#   db-max-idle-conns: 5    (roughly 20% of max-open-conns)
#   db-conn-max-lifetime: 30m
#   db-conn-max-idle-time: 10m
#
# For high-concurrency deployments (many parallel requests):
#   db-max-open-conns: 50    (tune based on PostgreSQL max_connections)
#   db-max-idle-conns: 10
#   db-conn-max-lifetime: 15m
#   db-conn-max-idle-time: 5m
#
# Setting max-open-conns to 0 means unlimited (not recommended for PostgreSQL).
# Setting lifetime/idle-time to 0 means no limit.
db-max-open-conns: 25
db-max-idle-conns: 5
db-conn-max-lifetime: "30m"
db-conn-max-idle-time: "10m"
