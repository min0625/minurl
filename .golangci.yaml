# https://golangci-lint.run/docs/configuration/file/
version: "2"

issues:
  whole-files: true

  max-same-issues: 0       # 0 = unlimited; default 3
  max-issues-per-linter: 0 # 0 = unlimited; default 50

  uniq-by-line: false      # default true hides other linters' findings on the same line

formatters:
  enable:
    # goimports rides along with gofumpt because it alone drops unused imports.
    - gofumpt
    - goimports
    - golines

  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      max-len: 120

linters:
  default: none
  enable:
    # Standard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional
    - bodyclose
    - canonicalheader
    - depguard
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocognit
    - goconst
    - gocritic
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - loggercheck
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - promlinter
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - wsl_v5

  settings:
    govet:
      enable:
        - deepequalerrors
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite

    nolintlint:
      require-specific: true
      require-explanation: true

    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package

    gomodguard_v2:
      # A local `replace` that reaches main breaks the tagged release build.
      # Only sees directly imported modules; an indirect dep's replace slips through.
      local-replace-directives: true

      # Bar for an entry: archived or known-vulnerable, AND still reached for
      # directly today because old tutorials point there.
      blocked:
        - module: github.com/Azure/azure-sdk-for-go
          reason: Track 1 (services/, storage/, profiles/) retired 2023-09-30; use the sdk/ modules (track 2)
        - module: github.com/aws/aws-sdk-go
          recommendations:
            - github.com/aws/aws-sdk-go-v2
          reason: End-of-support since 2025-07-31; no further updates, including security fixes
        - module: github.com/dgrijalva/jwt-go
          recommendations:
            - github.com/golang-jwt/jwt/v5
          reason: Unmaintained; golang-jwt is the community continuation
        - module: github.com/golang/mock
          recommendations:
            - go.uber.org/mock
          reason: Archived upstream; go.uber.org/mock is the maintained fork
        - module: github.com/satori/go.uuid
          recommendations:
            - github.com/google/uuid
          reason: Unmaintained; on Go 1.27+ prefer the stdlib uuid package

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - goconst
